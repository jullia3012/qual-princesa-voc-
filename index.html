<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual Princesa Você É?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <h1>Qual Princesa Você É?</h1>

        <!-- Tela Inicial -->
        <div class="tela-inicial">
            <p class="descricao-missao">
                Descubra qual princesa combina mais com a sua personalidade! Responda às perguntas e veja a sua jornada real.
            </p>
            <button class="btn-iniciar">Descobrir Agora</button>
        </div>

        <!-- Tela do Jogo -->
        <div class="tela-jogo esconder">
            <p class="enunciado"></p>
            <div class="caixa-alternativas"></div>
        </div>

        <!-- Tela do Resultado -->
        <div class="tela-resultado esconder">
            <h2>O seu destino real:</h2>
            <p class="texto-resultado"></p>
            <button class="btn-reiniciar">Jogar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
